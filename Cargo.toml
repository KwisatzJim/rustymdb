[package]
name = "rustymdb"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Self-hosted IMDb-first movie browser with optional TMDB enrichment"
readme = "README.md"

[dependencies]
askama = "0.16"
axum = "0.8"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.24"
html-escape = "0.2"
getrandom = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "io-util"] }
